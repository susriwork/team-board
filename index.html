<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ทีมส้มบางซื่อ 🍊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap">
<style>
/* Layout: sticky top bar with tabs + filter strip; each view is a full-width working surface. Case-tracking office tool for a district council team. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e9eeec; --line:#d5ddda;
  --ink:#16242a; --muted:#5c6b70; --accent:#1d6e58; --accent-ink:#ffffff; --accent-soft:#dcece6; --field-line:#b3c0bc; --ph:#97a3a7; --lbl:#2b3a40; --orange:#f26b1d; --orange-ink:#e8641a; --orange-soft:#ffc49a;
  --danger:#b3261e; --danger-soft:#fbe4e1; --warn:#8a5a00; --warn-soft:#fdf0d5; --info:#235b8f; --info-soft:#e1ecf7;
  --violet:#6b4fa0; --violet-soft:#ece6f6; --done:#8a979b;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101719; --surface:#172124; --sunk:#0c1214; --line:#2a383c;
  --ink:#e4ecea; --muted:#94a5a9; --accent:#5cc4a1; --accent-ink:#06231a; --accent-soft:#16352c; --field-line:#3e5054; --ph:#66787c; --lbl:#c9d6d3; --orange:#f27a33; --orange-ink:#ff9a55; --orange-soft:#7a3f1c;
  --danger:#ff8a80; --danger-soft:#3a1d1b; --warn:#f2c46b; --warn-soft:#33280f; --info:#8cbdf0; --info-soft:#16283a;
  --violet:#c3a8f0; --violet-soft:#2a2140; --done:#6d7b7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101719; --surface:#172124; --sunk:#0c1214; --line:#2a383c;
  --ink:#e4ecea; --muted:#94a5a9; --accent:#5cc4a1; --accent-ink:#06231a; --accent-soft:#16352c; --field-line:#3e5054; --ph:#66787c; --lbl:#c9d6d3; --orange:#f27a33; --orange-ink:#ff9a55; --orange-soft:#7a3f1c;
  --danger:#ff8a80; --danger-soft:#3a1d1b; --warn:#f2c46b; --warn-soft:#33280f; --info:#8cbdf0; --info-soft:#16283a;
  --violet:#c3a8f0; --violet-soft:#2a2140; --done:#6d7b7f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 0}
.brand{font:700 20px/1.2 var(--f-display);margin-right:auto;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font:500 12px var(--f-body);color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:8px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 13px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--danger);color:#fff;font:600 11px/18px var(--f-mono);text-align:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px;border-top:1px solid var(--line);align-items:center}
.filters input[type=search]{flex:1 1 180px;min-width:0}
.filters select{max-width:min(100%,240px)}
select,input[type=text],input[type=url],input[type=search],input[type=date],input[type=time],input[type=number],input[type=email],input[type=tel],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px;min-width:0}
textarea{resize:vertical;width:100%}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
main{padding-block:20px 48px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:16px}
h2{font:600 18px/1.3 var(--f-display);margin:0 0 12px;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-display);margin:0 0 8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:80ch}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* type badges */
.ty{font:600 11px var(--f-body);padding:1px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.2px}
.ty.task{background:var(--sunk);color:var(--muted)}
.ty.letter{background:var(--info-soft);color:var(--info)}
.ty.event{background:var(--warn-soft);color:var(--warn)}
.ty.content{background:var(--violet-soft);color:var(--violet)}
.ty.appt{background:var(--accent-soft);color:var(--accent)}
.chip.k-appt{border-left-color:var(--danger)}

/* overview */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font:600 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--danger)} .stat.wait b{color:var(--info)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.alist li{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:6px;cursor:pointer;flex-wrap:wrap}
.alist li:hover{background:var(--sunk)}
.cal-legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:99px;padding:3px 10px 3px 8px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.cal-legend button:hover{border-color:var(--line);background:var(--surface)}
.cal-legend i{margin-right:0}
.cal-legend button[aria-pressed="false"]{color:var(--muted);text-decoration:line-through;opacity:.6}
.cal-legend button[aria-pressed="false"] i{background:transparent!important;outline:1.5px solid var(--muted);outline-offset:-1.5px}
.cal-legend .cal-all{border-color:var(--line);color:var(--accent);text-decoration:none}
.agenda{display:grid;gap:14px}
.ag-day h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font:600 14px var(--f-display);color:var(--ink);padding-bottom:4px;border-bottom:1px solid var(--line)}
.ag-rel{font:500 12px var(--f-body);padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.ag-day.is-today .ag-rel{background:var(--warn-soft);color:var(--warn)}
.ag-day.is-tmr .ag-rel{background:var(--info-soft);color:var(--info)}
.ag-day.is-today h4{border-bottom-color:var(--orange,var(--accent))}
.ag-day ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ag-day li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:7px 6px;border-radius:6px;cursor:pointer}
.ag-day li:hover{background:var(--sunk)}
.ag-time{font:600 13px var(--f-mono);color:var(--accent);padding-top:2px}
.ag-body{display:grid;gap:3px;min-width:0}
.ag-title{font-weight:500;overflow-wrap:anywhere}
.ag-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.alist .t{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.when{font:500 12px var(--f-mono);padding:1px 7px;border-radius:99px;white-space:nowrap}
.when.over{background:var(--danger-soft);color:var(--danger)}
.when.today,.when.tmr{background:var(--warn-soft);color:var(--warn)}
.when.week{background:var(--info-soft);color:var(--info)}
.when.plain{color:var(--muted)}
.proj{display:grid;gap:12px}
.proj-row{display:grid;gap:4px;cursor:pointer;padding:6px;border-radius:6px}
.proj-row:hover{background:var(--sunk)}
.proj-row .top{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:14px}
.proj-row .top span:first-child{min-width:0;overflow-wrap:anywhere}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.load{display:grid;grid-template-columns:minmax(60px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.bad{background:var(--danger)}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
table.wide{min-width:980px}
th{font:600 12px var(--f-body);letter-spacing:.3px;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th[data-sort]{cursor:pointer}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--sunk)}
tr.closed td{color:var(--done)}
tr.closed td.title b{text-decoration:line-through}
td.title{min-width:220px}
td.title b{font-weight:500}
td.title .sub{font-size:12.5px;color:var(--muted)}
td select{min-height:30px;padding:3px 6px;font-size:13px;max-width:190px}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.flags{display:inline-flex;gap:4px}
.flag{font:600 11px var(--f-body);padding:1px 6px;border-radius:4px}
.flag.imp{background:var(--accent-soft);color:var(--accent)}
.flag.urg{background:var(--danger-soft);color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;flex:none}
.prog{font:500 12px var(--f-mono);color:var(--muted)}

/* kanban */
.board-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start;scroll-behavior:smooth}
.board .col{flex:1 0 250px;max-width:340px}
.board .col.is-empty{flex:0 0 150px}
@media (min-width:641px){
  .board{scrollbar-width:none}
  .board::-webkit-scrollbar{display:none}
}
.bscroll{display:inline-flex;gap:6px;margin-left:auto}
.bscroll .btn{min-width:40px;font-size:18px;line-height:1;padding:6px 10px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col.agency{background:var(--info-soft)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;font:600 14px var(--f-display);padding:2px 4px}
.col-h .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.col-h small{font:500 11px var(--f-body);color:var(--info)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;cursor:grab;display:grid;gap:6px;font-size:13.5px}
.card .ct{font-weight:500;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:12.5px;align-items:center}
.card.closed .ct{color:var(--done);text-decoration:line-through}
.card.overdue{border-left:3px solid var(--danger)}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-h h2{margin:0 auto 0 0}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(108px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px;min-width:760px}
.dow{background:var(--surface);font:600 12px var(--f-body);color:var(--muted);padding:8px;text-align:center}
.day{background:var(--surface);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{background:var(--sunk)}
.day.out .dn{color:var(--done)}
.dn{font:500 13px var(--f-mono)}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:99px;width:24px;height:24px;display:grid;place-items:center}
.chip{font-size:12px;padding:2px 6px;border-radius:4px;background:var(--sunk);border-left:3px solid var(--muted);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{font:600 10.5px var(--f-body);margin-right:4px}
.chip.k-leave{border-left-color:var(--muted);background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px)}
.chip.k-due{border-left-color:var(--accent)} .chip.k-follow{border-left-color:var(--info)} .chip.k-event{border-left-color:var(--warn)} .chip.k-post{border-left-color:var(--violet)}
.day.out .chip{background:var(--surface)}
.more{font-size:11.5px;color:var(--accent);cursor:pointer;border:0;background:none;padding:0;text-align:left}

/* matrix */
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.matrix{grid-template-columns:1fr}}
.quad{border-radius:var(--r);padding:14px;min-height:200px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.quad.q1{background:var(--danger-soft)} .quad.q2{background:var(--accent-soft)} .quad.q3{background:var(--warn-soft)} .quad.q4{background:var(--sunk)}
.quad.over{outline:2px dashed var(--ink);outline-offset:-4px}
.quad h3 small{font:400 12.5px var(--f-body);color:var(--muted);margin-left:6px}

/* kpi / summary */
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:16px}
.ctl label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.ctl input[type=number]{width:80px}
.wsum{font-size:13px;padding:6px 10px;border-radius:6px}
.wsum.ok{background:var(--accent-soft);color:var(--accent)} .wsum.bad{background:var(--danger-soft);color:var(--danger)}
.score{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.score .meter{width:80px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:16px}
.sumgrid .panel table{min-width:0}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.set-grid textarea{min-height:160px;font-size:14px}
.set-row{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin-bottom:10px}
.flow .arrow{color:var(--muted)}

/* dialog */
dialog{overflow-x:hidden;border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,20,22,.45)}
.dlg{padding:20px;display:grid;gap:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--lbl);min-width:0}
.form input:not([type=checkbox]),.form select,.form textarea{font-weight:400;font-size:15px;color:var(--ink);border-color:var(--field-line)}
.form input:not([type=checkbox]):focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.form ::placeholder{color:var(--ph);font-weight:400;opacity:1}
.form label.pick,.form label.chk{font-weight:400}
.form .muted{font-weight:400}
.flbl{font-size:13px;font-weight:600;color:var(--lbl)}
/* ธีม: เขียวเดิม + ส้ม */
header.top{border-top:5px solid var(--orange)}
header.top .brand{color:var(--orange-ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--orange);border-bottom-width:3px}
.stat{border-top:3px solid var(--orange-soft)}
.stat b{color:var(--accent)}
.stat.alert b{color:var(--danger)} .stat.wait b{color:var(--info)}
.panel h3{color:var(--accent)}
/* หน้าต่างกรอกเรื่อง: ฟอนต์ไทยมีหัว อ่านง่าย หัวข้อตัวหนา */
#dlg{font-family:"Noto Sans Thai Looped",var(--f-body)}
#dlg .form label,#dlg .flbl{font-weight:700}
#dlg .form label.pick,#dlg .form label.chk{font-weight:400}
.form input:not([type=checkbox]),.form select{width:100%}
.form .cl-row input[type=text]{width:auto;flex:1 1 auto;min-width:0}
.form .cl-row input[type=date]{width:auto;flex:none}
.form .cl-row input[type=checkbox]{flex:none;width:18px;height:18px;margin:0}
.dlg-h{display:flex;align-items:center;gap:12px;justify-content:space-between}
.dlg-x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);flex:none}
.dlg-x:hover{color:var(--ink);border-color:var(--muted)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.who-add{display:flex;gap:6px;margin-top:8px;max-width:420px}.form .who-add input{flex:1 1 auto;min-width:0;width:auto}.who-add .btn{flex:none;white-space:nowrap}
.pick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 8px;cursor:pointer;font-size:14px;color:var(--ink);background:var(--surface)}
.pick input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.pick:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.prow{display:grid;grid-template-columns:150px minmax(0,170px) minmax(0,1fr);gap:8px;align-items:center}
.prow .pick{justify-content:flex-start}
.prow input[type=date],.prow input[type=url]{width:100%}
@media (max-width:560px){.prow{grid-template-columns:1fr 1fr}.prow .pick{grid-column:1/-1;justify-self:start}}
.form fieldset{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form legend{font:600 13px var(--f-display);color:var(--ink);padding:0 6px}

<div class="login" id="login" hidden>

function sbAssets() {
  return {
    async upload(file, { type }) {
      const ext = ((file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "") || "bin").slice(0, 8);
      const path = `${todayISO().slice(0, 7)}/${crypto.randomUUID()}.${ext}`;
      const { error } = await SB.storage.from(BUCKET).upload(path, file, { contentType: type, upsert: false, cacheControl: "3600" });
      if (error) throw sbErr(error);
      return { id: path, contentType: type, sizeBytes: file.size };
    },
    async delete(id) { const { error } = await SB.storage.from(BUCKET).remove([id]); if (error) throw sbErr(error); URLS.delete(id); return { deleted: true }; },
    async list() {
      const out = [];
      const { data: top, error } = await SB.storage.from(BUCKET).list("", { limit: 1000 });
      if (error) throw sbErr(error);
      for (const f of top || []) {
        if (f.id) { out.push({ id: f.name, sizeBytes: (f.metadata && f.metadata.size) || 0 }); continue; }
        for (let off = 0; ; off += 1000) {
          const { data } = await SB.storage.from(BUCKET).list(f.name, { limit: 1000, offset: off });
          (data || []).forEach(x => x.id && out.push({ id: f.name + "/" + x.name, sizeBytes: (x.metadata && x.metadata.size) || 0 }));
          if (!data || data.length < 1000) break;
        }
      }
      return { assets: out, usage: { files: out.length, bytes: out.reduce((s, a) => s + a.sizeBytes, 0), maxBytes: FREE_STORAGE } };
    }
  };
}

const CAL_KINDS = [["due", "--accent", "กำหนดส่งงานทีม"], ["follow", "--info", "นัดติดตามหนังสือ"], ["event", "--warn", "วันจัดกิจกรรม"], ["appt", "--danger", "นัดหมาย"], ["post", "--violet", "วันโพสต์"], ["leave", "--muted", "วันลา"]];
const calHidden = () => Array.isArray(S.calHide) ? S.calHide : (S.calHide = (Array.isArray(recall("tb.calhide")) ? recall("tb.calhide") : []));

function calEntriesAll() {

function vCal() {
  const today = todayISO(), startDow = S.cfg.weekStart === "sun" ? 0 : 1;
  const first = new Date(S.calY, S.calM, 1), off = (first.getDay() - startDow + 7) % 7;
  const start = new Date(S.calY, S.calM, 1 - off), byDay = {};
  calEntries().forEach(e => (byDay[e[0]] = byDay[e[0]] || []).push(e));
  const weeks = Math.ceil((off + new Date(S.calY, S.calM + 1, 0).getDate()) / 7);
  let cells = "";
  for (let i = 0; i < 7; i++) cells += `<div class="dow">${DOW[(i + startDow) % 7]}</div>`;
  for (let i = 0; i < weeks * 7; i++) {

    <button class="btn" type="button" data-cal="-1" aria-label="เดือนก่อน">‹</button><button class="btn" type="button" data-cal="0">เดือนนี้</button><button class="btn" type="button" data-cal="1" aria-label="เดือนถัดไป">›</button></div>
    <div class="legend cal-legend" role="group" aria-label="เลือกรายการที่แสดงในปฏิทิน">${CAL_KINDS.map(([k, col, lab]) => `<button type="button" data-calk="${k}" aria-pressed="${!calHidden().includes(k)}" title="กดเพื่อซ่อน/แสดง"><i style="background:var(${col})"></i>${lab}</button>`).join("")}${calHidden().length ? `<button type="button" class="cal-all" data-calk="*">แสดงทั้งหมด</button>` : ""}</div>
    <div class="cal-scroll only-wide"><div class="cal">${cells}</div></div><div id="dayList" class="only-wide"></div>
    <div class="agenda only-narrow">${(() => { const days = Object.keys(byDay).filter(k => { const dd = parse(k); return dd.getFullYear() === S.calY && dd.getMonth() === S.calM; }).sort();
      return days.length ? days.map(k => { const dd = parse(k); return `<div class="ad ${k === today ? "today" : ""}"><div class="ad-d"><b>${dd.getDate()}</b><span>${DOW[dd.getDay()]}</span></div>
        <div style="display:grid;gap:4px;min-width:0">${byDay[k].map(([, kind, lab, t]) => `<div class="chip k-${kind}" data-open="${t.id}"><b>${esc(lab)}</b>${esc(t.title)}${who(t).length ? ` <span class="muted">· ${esc(whoTxt(t))}</span>` : ""}</div>`).join("")}</div></div>`; }).join("")
        : `<p class="muted">ไม่มีรายการในเดือนนี้</p>`; })()}</div>`;
}

const inRange = d => !!d && d >= (S.from || "0000") && d <= (S.to || "9999");
const rangeCtl = () => `<label>ตั้งแต่<input type="date" id="rf" value="${S.from}"></label><label>ถึง<input type="date" id="rt" value="${S.to}"></label>

function reportData() {
  const all = S.items.filter(t => ownerOf(t) !== "cancel");
  const letters = all.filter(t => typeOf(t) === "letter");
  const sent = letters.filter(t => inRange(t.letterDate));
  const replied = sent.filter(t => t.replyDate);
  const resolved = sent.filter(t => stageOf(t)[0] === "resolved"), unresolved = sent.filter(t => stageOf(t)[0] === "unresolved");
  const replyDays = replied.map(t => diffDays(t.replyDate, t.letterDate)).filter(n => n >= 0);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const byAgency = {};
  sent.forEach(t => { const k = t.agency || "ไม่ระบุหน่วยงาน"; const r = byAgency[k] = byAgency[k] || { sent: 0, replied: 0, resolved: 0, waiting: 0, days: [] };
    r.sent++; if (t.replyDate) { r.replied++; r.days.push(diffDays(t.replyDate, t.letterDate)); } if (stageOf(t)[0] === "resolved") r.resolved++; if (isAgency(t)) r.waiting++; });
  const touched = all.filter(t => inRange(t.letterDate) || inRange(t.doneAt) || inRange(t.eventDate) || inRange(t.apptDate) || postsOf(t).some(x => inRange(x.date)) || inRange(t.due));
  const byArea = {};
  touched.forEach(t => { const k = t.area || "ไม่ระบุพื้นที่"; const r = byArea[k] = byArea[k] || { n: 0, letters: 0, closed: 0 }; r.n++; if (typeOf(t) === "letter") r.letters++; if (ownerOf(t) === "done") r.closed++; });
  const events = all.filter(t => typeOf(t) === "event" && inRange(t.eventDate) && ["held", "done"].includes(stageOf(t)[0]));
  const appts = all.filter(t => typeOf(t) === "appt" && inRange(t.apptDate) && stageOf(t)[0] === "attended");
  const posted = all.filter(t => typeOf(t) === "content" && stageOf(t)[0] === "posted");
  const postEntries = posted.flatMap(t => postsOf(t).filter(x => inRange(x.date || t.doneAt)));
  const posts = posted.filter(t => postsOf(t).some(x => inRange(x.date || t.doneAt)) || (!postsOf(t).length && inRange(t.doneAt)));
  const byPlat = {}; postEntries.forEach(x => byPlat[x.platform || "ไม่ระบุ"] = (byPlat[x.platform || "ไม่ระบุ"] || 0) + 1);
  return { sent, replied, resolved, unresolved, avgReply: avg(replyDays), waitingNow: letters.filter(isAgency), byAgency, byArea, events,
    people: events.reduce((s, t) => s + (+t.delivered || 0), 0), appts, posts, postEntries, byPlat, avg };
}

function kpiRows() {
  const w = S.cfg.weights, wsum = (+w.done || 0) + (+w.ontime || 0), today = todayISO();
  return S.cfg.assignees.map(n => {
    const counted = S.items.filter(t => who(t).includes(n) && inRange(t.due) && !["cancel", "hold"].includes(ownerOf(t)));
    const done = counted.filter(teamDone);
    const dated = done.filter(t => teamDoneDate(t) && t.due);
    const ontime = dated.filter(t => teamDoneDate(t) <= t.due).length;
    const rej = counted.filter(t => (t.rejectCount || 0) > 0).length;
    const overdue = counted.filter(t => isTeamOpen(t) && t.due < today).length;
    const pDone = counted.length ? done.length / counted.length : null, pOn = dated.length ? ontime / dated.length : null;
    const score = counted.length && wsum === 100 ? w.done * (pDone || 0) + w.ontime * (pOn || 0) : null;
    return { n, total: counted.length, done: done.length, pDone, ontime, dated: dated.length, pOn, rej, pRej: counted.length ? rej / counted.length : null, overdue, score };
  });
}

    if (!tasks.length && !cfg) { toast("ไม่พบข้อมูลในไฟล์นี้"); return; }
    const known = new Set(S.items.map(t => t.id));
    const clean = tasks.map(t => ({ ...t, attachments: attOf(t).filter(a => String(a.id).includes("/")) }));
    const dropped = tasks.reduce((n, t) => n + attOf(t).filter(a => !String(a.id).includes("/")).length, 0);
    const box = $("#impBox");
    box.innerHTML = `<div class="panel" style="margin-top:10px;display:grid;gap:8px"><b>พบ ${tasks.length} เรื่อง${cfg ? " และการตั้งค่า" : ""}</b>
      <span style="font-size:13.5px">${tasks.filter(t => known.has(String(t.id))).length} เรื่องมีอยู่แล้ว จะถูกแทนที่ด้วยข้อมูลในไฟล์ · ${tasks.filter(t => !known.has(String(t.id))).length} เรื่องใหม่${cfg ? " · การตั้งค่าปัจจุบันจะถูกแทนที่" : ""}${dropped ? ` · ไฟล์แนบ ${dropped} ไฟล์จากระบบเดิมย้ายตามมาไม่ได้ (เหลือแค่ข้อมูลเรื่อง)` : ""}</span>
      <div style="display:flex;gap:8px"><button class="btn primary" type="button" id="impGo">นำเข้า</button><button class="btn ghost" type="button" id="impNo">ยกเลิก</button></div></div>`;
    $("#impNo").onclick = () => box.innerHTML = "";
    $("#impGo").onclick = async () => { $("#impGo").disabled = true; if (await write(() => api.importAll(cfg, clean), "นำเข้าข้อมูลแล้ว")) box.innerHTML = ""; else $("#impGo").disabled = false; };
  };
  const b = $("#saveSet"); if (!b) return;
  b.onclick = () => {
    const lines = id => [...new Set($("#" + id).value.split("\n").map(s => s.trim()).filter(Boolean))];
    const c = { ...S.cfg, assignees: lines("sA"), projects: lines("sP"), agencies: lines("sG"), areas: lines("sR"), categories: lines("sC"),
      followupDays: Math.min(120, Math.max(1, +$("#sF").value || 15)), weekStart: $("#sWeek").value };
    write(() => api.saveCfg(c), "บันทึกการตั้งค่าแล้ว");
  };
}

    const wn = $("#whoNew"), wnb = $("#whoNewAdd");
    if (wn && wnb) {
      const addWho = () => { const n = wn.value.trim().replace(/\s+/g, " "); if (!n) { wn.focus(); return; }
        collect(); if (!people.includes(n)) people.push(n); draw(); const nx = $("#whoNew"); if (nx) nx.focus(); };
      wnb.onclick = addWho;
      wn.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addWho(); } };
    }
    const add = $("#clAdd"); if (add) add.onclick = () => { collect(); checklist.push({ t: "", done: false }); draw(); const last = document.querySelector(`[data-clt="${checklist.length - 1}"]`); if (last) last.focus(); };
    document.querySelectorAll("[data-clr]").forEach(b => b.onclick = () => { collect(); checklist.splice(+b.dataset.clr, 1); draw(); });
    const fa = $("#fuAdd"); if (fa) fa.onclick = () => { collect(); const note = $("#fuNote").value.trim(); if (!note) { $("#fuNote").focus(); return; }
      followups.push({ date: $("#fuDate").value || todayISO(), note }); t.followUpDate = addDays(todayISO(), +S.cfg.followupDays || 15); draw(); };
    document.querySelectorAll("[data-dview]").forEach(b => b.onclick = () => { collect(); openViewer(files.map(a => ({ ...a, item: t.title })), +b.dataset.dview); });
    const fi = $("#t_files");
    if (fi) fi.onchange = async () => {
      collect();
      const list = [...fi.files]; fi.value = ""; fileErrs = [];
      let added = 0;
      for (let i = 0; i < list.length; i++) {
        const fl = list[i], ty = fileType(fl);
        if (!ty) { fileErrs.push(`${fl.name}: ไม่รองรับไฟล์ประเภทนี้ (วิดีโอ .MOV จาก iPhone หรือไฟล์ Word/Excel ให้ใช้ลิงก์ Google Drive แทน)`); continue; }
        if (fl.size > MAX_FILE) { fileErrs.push(`${fl.name}: ${fmtSize(fl.size)} ใหญ่เกิน 50 MB (เพดานของแผนฟรี) ให้อัปโหลดขึ้น Google Drive แล้วใส่เป็นลิงก์`); continue; }
        busy = `กำลังอัปโหลด ${i + 1}/${list.length}: ${fl.name}`; draw();
        try {
          const res = await S.assets.upload(fl, { type: ty });
          files.push({ id: res.id, name: fl.name, type: res.contentType, size: res.sizeBytes, at: new Date().toISOString(), by: S.myId || "" });
          added++;
          if (!id) pending.push(res.id);
        } catch (err) {
          fileErrs.push(`${fl.name}: ${assetErr(err)}`);
          if (["rate_limited", "quota_or_state", "not_granted", "capability_disabled"].includes(err && err.code)) break;
        }
        collect();
      }
      busy = "";
      if (added && id) { if (await saveFiles()) toast(`แนบไฟล์แล้ว ${added} ไฟล์`); }
      else if (added) toast(`อัปโหลดแล้ว ${added} ไฟล์ กดเพิ่มเรื่องเพื่อบันทึก`);
      draw();
    };
    document.querySelectorAll("[data-frm]").forEach(b => b.onclick = async () => {
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "ยืนยันลบ"; b.classList.add("danger"); return; }
      collect();
      const a = files[+b.dataset.frm]; if (!a) return;
      b.disabled = true;
      try { await S.assets.delete(a.id); }
      catch (err) { b.disabled = false; toast(assetErr(err)); return; }
      files = files.filter(x => x.id !== a.id); pending = pending.filter(x => x !== a.id);
      if (await saveFiles()) toast("ลบไฟล์แล้ว");
      draw();
    });
    const lk = $("#lkAdd"); if (lk) lk.onclick = () => { collect(); links.push({ name: "", url: "" }); draw(); const el = document.querySelector(`[data-lname="${links.length - 1}"]`); if (el) el.focus(); };
    document.querySelectorAll("[data-lrm]").forEach(b => b.onclick = () => { collect(); links.splice(+b.dataset.lrm, 1); draw(); });
    document.querySelectorAll("[data-rmfu]").forEach(b => b.onclick = () => { collect(); followups.splice(+b.dataset.rmfu, 1); draw(); });
    const del = $("#t_del");
    if (del) del.onclick = async () => {
      if (!del.dataset.armed) { del.dataset.armed = "1"; del.textContent = "กดอีกครั้งเพื่อยืนยันการลบ"; return; }
      if (await write(() => api.del(id), "ลบแล้ว")) {
        if (S.assets) for (const a of files) { try { await S.assets.delete(a.id); } catch {} }
        $("#dlg").close();
      }
    };
    const dup = $("#t_dup");
    if (dup) dup.onclick = () => { collect(); const { id: _i, updatedAt, updatedBy, createdAt, letterNo, letterDate, followUpDate, replyDate, replySummary, doneAt, rejectCount, attachments, links: _l, ...rest } = t;
      $("#dlg").close(); openItem(null, { ...rest, assignees: people, posts: posts.map(x => ({ platform: x.platform, date: "", url: "" })), type, status: stages(type)[0][0], checklist: checklist.map(c => ({ t: c.t, done: false })), followups: [], location: "" }); toast("สำเนาพร้อมแก้ไข ใส่จุดใหม่แล้วกดเพิ่มเรื่อง"); };
    if (id && src.updatedAt) {
      const when = new Date(src.updatedAt).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
      const n = /@/.test(src.updatedBy || "") ? src.updatedBy : "";
      const m = $("#t_meta"); if (m) m.textContent = `แก้ไขล่าสุด ${when}${n ? " โดย " + n : ""}`;
    }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    collect();
    if (busy) { toast("รออัปโหลดไฟล์ให้เสร็จก่อน"); return; }
    if (!t.title.trim()) { $("#t_title").focus(); return; }
    if (SB && !S.seeAll && people.length && !people.includes(S.myName) && !isAll(people) && !f.dataset.warned) {
      f.dataset.warned = "1";
      toast(S.myName ? `คุณ (${S.myName}) ไม่ได้อยู่ในผู้รับผิดชอบ หลังบันทึกคุณจะมองไม่เห็นเรื่องนี้ กดบันทึกอีกครั้งเพื่อยืนยัน` : "หลังบันทึกคุณอาจมองไม่เห็นเรื่องนี้ กดบันทึกอีกครั้งเพื่อยืนยัน");
      return;
    }
    const badLink = links.find(l => l.url && !safeUrl(l.url));
    if (badLink) { toast("ลิงก์ต้องขึ้นต้นด้วย https://"); return; }
    const d = { ...t, type, attachments: files, links: links.filter(l => l.url), title: t.title.trim(), checklist: checklist.filter(c => c.t.trim()), followups, assignees: people, assignee: "", allTeam: isAll(people) || !people.length,
      posts: type === "content" ? posts : postsOf(t), platform: "", postDate: "", postUrl: "" };
    delete d.difficulty;
    ["target", "delivered"].forEach(k => { if (d[k] !== undefined && d[k] !== "") d[k] = +d[k]; });
    delete d.id;
    const patch = autoPatch(id ? src : { status: "" }, d);
    const ok = id ? await write(() => api.save(id, stamp(patch)), "บันทึกแล้ว")
                  : await write(() => api.add(stamp({ ...patch, createdAt: new Date().toISOString() })), "เพิ่มเรื่องแล้ว");
    if (ok) { saved = true; pending = []; $("#dlg").close(); learnChoices(d); }
  };
  S.openId = id || ""; syncHash();
  $("#dlg").onclose = () => {
    S.openId = ""; syncHash();
    if (!saved && pending.length && S.assets) pending.forEach(pid => S.assets.delete(pid).catch(() => {}));
    pending = [];
  };
  draw();
  $("#dlg").showModal();
  if (!id) $("#t_title").focus();
}

/* quick follow-up logging from the follow tab */
function openFollow(id) {
  const t = S.items.find(x => x.id === id); if (!t) return;
  $("#dlg").onclose = null;
  const f = $("#tf");
  f.innerHTML = `<div class="dlg-h"><h2 style="margin:0">บันทึกการติดตาม</h2><button class="dlg-x" type="button" id="q_x" aria-label="ปิด">×</button></div>
  <p style="margin:0"><b>${esc(t.title)}</b><br><span class="muted">${esc(t.agency || "")}${t.letterNo ? " · หนังสือ " + esc(t.letterNo) : ""}${t.letterDate ? " · ส่ง " + fmtDY(t.letterDate) : ""}</span></p>
  <div class="form">
    <label>วันที่ติดตาม<input type="date" id="q_date" value="${todayISO()}"></label>
    <label>นัดติดตามครั้งถัดไป<input type="date" id="q_next" value="${addDays(todayISO(), +S.cfg.followupDays || 15)}"></label>
    <label class="full">ได้ความว่าอย่างไร<textarea id="q_note" rows="3" placeholder="เช่น โทรคุยฝ่ายโยธาเขต แจ้งว่าบรรจุในแผนซ่อมเดือนหน้า"></textarea></label>
    <label class="full">ขั้นตอนหลังติดตาม<select id="q_stage">${stages("letter").filter(s => ["sent", "acting", "resend", "escalate", "resolved", "unresolved"].includes(s[0])).map(s => `<option value="${s[0]}"${s[0] === t.status ? " selected" : ""}>${esc(s[1])}</option>`).join("")}</select></label>
  </div>
  <div class="dlg-f"><span class="sp"></span><button class="btn ghost" type="button" id="q_cancel">ปิด</button><button class="btn primary" type="submit">บันทึก</button></div>`;
  $("#q_cancel").onclick = () => $("#dlg").close();
  $("#q_x").onclick = () => $("#dlg").close();
  f.onsubmit = async e => {
    e.preventDefault();
    const note = $("#q_note").value.trim(); if (!note) { $("#q_note").focus(); return; }
    const d = { followups: [...(t.followups || []), { date: $("#q_date").value || todayISO(), note }], followUpDate: $("#q_next").value, status: $("#q_stage").value };
    if (await write(() => api.save(t.id, stamp(autoPatch(t, d))), "บันทึกการติดตามแล้ว")) $("#dlg").close();
  };
  $("#dlg").showModal();
  $("#q_note").focus();
}

/* ---------- drag & drop ---------- */
function bindDnd() {
  document.querySelectorAll(".card[draggable=true]").forEach(c => c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.id); e.dataTransfer.effectAllowed = "move"; }));
  document.querySelectorAll("[data-drop]").forEach(z => {
    z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", e => {
      e.preventDefault(); z.classList.remove("over");
      const t = S.items.find(x => x.id === e.dataTransfer.getData("text/plain")); if (!t) return;
      if (z.dataset.drop === "status") { if (t.status !== z.dataset.val) patchItem(t, { status: z.dataset.val }); }
      else { const q = z.dataset.val, p = { important: q === "q1" || q === "q2", urgent: q === "q1" || q === "q3" };
        if (p.important !== !!t.important || p.urgent !== !!t.urgent) patchItem(t, p); }
    });
  });
}

/* ---------- events ---------- */
// Ctrl/⌘ + คลิก หรือคลิกปุ่มกลางเมาส์ ที่แท็บหรือเรื่อง = เปิดในแท็บใหม่
function newTabClick(e) {
  if (e.target.closest("dialog") || e.target.closest("a, select, input, textarea")) return false;
  const tab = e.target.closest(".tab"), o = e.target.closest("[data-open]");
  if (tab) { e.preventDefault(); openNewTab(tab.dataset.v); return true; }
  if (o && !e.target.closest("button")) { e.preventDefault(); openNewTab(S.view, o.dataset.open); return true; }
  return false;
}
document.addEventListener("auxclick", e => { if (e.button === 1) newTabClick(e); });
document.addEventListener("mousedown", e => { if (e.button === 1 && e.target.closest(".tab, [data-open]")) e.preventDefault(); });
document.addEventListener("click", e => {
  if ((e.ctrlKey || e.metaKey) && newTabClick(e)) return;
  if (e.target.closest("dialog")) return;
  const tab = e.target.closest(".tab");
  if (tab) { S.view = tab.dataset.v; store("tb.view", S.view); render(); return; }
  const bsc = e.target.closest("[data-bscroll]");
  if (bsc) { const bd = document.querySelector(".board"); if (bd) bd.scrollBy({ left: +bsc.dataset.bscroll * Math.max(260, bd.clientWidth * 0.6), behavior: "smooth" }); return; }
  const bn = e.target.closest("[data-bnav]");
  if (bn) { const k = bn.dataset.bnav; if (k === "__more") { toggleSheet(!document.querySelector(".msheet")); return; } toggleSheet(false); S.view = k; store("tb.view", S.view); render(); try { window.scrollTo(0, 0); } catch (_) {} return; }
  if (e.target.closest("[data-logout]")) { toggleSheet(false); const lb = $("#logoutBtn"); if (lb) lb.click(); return; }
  const tl = e.target.closest(".tab-link[data-v]");
  if (tl) { S.view = tl.dataset.v; store("tb.view", S.view); render(); try { window.scrollTo(0, 0); } catch (_) {} return; }
  if (e.target.closest("select")) return;
  const ck = e.target.closest("[data-calk]");
  if (ck) { const k = ck.dataset.calk, h = calHidden(); S.calHide = k === "*" ? [] : h.includes(k) ? h.filter(x => x !== k) : [...h, k]; store("tb.calhide", S.calHide); render(); return; }
  const bt = e.target.closest("[data-btype]");
  if (bt) { S.boardType = bt.dataset.btype; store("tb.btype", S.boardType); render(); return; }
  const fu = e.target.closest("[data-follow]");
  if (fu) { openFollow(fu.dataset.follow); return; }
  const pj = e.target.closest("[data-proj]");
  if (pj) { S.filters.p = pj.dataset.proj; store("tb.f", S.filters); S.view = "table"; render(); return; }
  const sortTh = e.target.closest("th[data-sort]");
  if (sortTh) { S.sort = sortTh.dataset.sort; render(); return; }
  const cal = e.target.closest("[data-cal]");
  if (cal) { const n = +cal.dataset.cal, d = n === 0 ? new Date() : new Date(S.calY, S.calM + n, 1); S.calY = d.getFullYear(); S.calM = d.getMonth(); render(); return; }
  const more = e.target.closest("[data-day]");
  if (more) { const k = more.dataset.day, items = calEntries().filter(x => x[0] === k);
    $("#dayList").innerHTML = `<div class="panel" style="margin-top:12px"><h3>${fmtDY(k)}</h3><ul class="alist">${items.map(([, , lab, t]) => `<li data-open="${t.id}"><span class="when plain">${lab}</span><span class="t">${esc(t.title)}</span><span class="muted">${esc(whoTxt(t))}</span>${pill(t)}</li>`).join("")}</ul></div>`; return; }
  const vb = e.target.closest("[data-view]");
  if (vb) { const t = S.items.find(x => x.id === vb.dataset.view); if (t) openViewer(attOf(t).map(a => ({ ...a, item: t.title })), +vb.dataset.vi); return; }
  const gb = e.target.closest("[data-gview]");
  if (gb) { openViewer(S.gallery || [], +gb.dataset.gview); return; }
  if (e.target.closest("a[data-nolink]")) return;
  const o = e.target.closest("[data-open]");
  if (o) openItem(o.dataset.open);
});
document.addEventListener("change", e => {
  const s = e.target.closest("select[data-status]");
  if (s) { const t = S.items.find(x => x.id === s.dataset.status); if (t) patchItem(t, { status: s.value }); }
});
["#fq", "#ft", "#fa", "#fp", "#fr", "#fh"].forEach(id => $(id).addEventListener("input", () => {
  S.filters = { t: $("#ft").value, a: $("#fa").value, p: $("#fp").value, r: $("#fr").value, h: $("#fh").checked };
  store("tb.f", S.filters); render();
}));
$("#fBtn").onclick = () => { S.fOpen = !S.fOpen; renderFilters(); };
function setMine(on) { S.mine = on; store("tb.mine", on); render(); }
$("#mineBtn").onclick = () => {
  if (!S.myName) { toast("บัญชีนี้ยังไม่ได้ผูกชื่อในทีม ให้ผู้ดูแลเพิ่มอีเมลนี้ในรายชื่อสมาชิก"); return; }
  if (!inTeam()) { toast(`บัญชี ${S.myName} ไม่ได้เป็นชื่อในทีม จึงไม่มีงานของตัวเอง`); return; }
  setMine(!mineOn());
};
$("#addBtn").onclick = () => S.view === "leave" && SB && S.canWrite ? openLeaveDlg() : openItem(null, { ...(S.filters.a ? { assignees: [S.filters.a] } : {}), ...(S.filters.p ? { project: S.filters.p } : {}),
  ...(S.view === "board" ? { type: S.boardType } : {}) });

/* ---------- boot ---------- */
(function boot() {
  const d = new Date(); S.calY = d.getFullYear(); S.calM = d.getMonth();
  const v = recall("tb.view"); if (v && TABS.some(t => t[0] === v)) S.view = v;
  const hp = new URLSearchParams(location.hash.slice(1)), hv = hp.get("v"), ht = hp.get("t");
  if (hv && TABS.some(t => t[0] === hv)) S.view = hv;
  S.pendingOpen = ht || "";
  const bt = recall("tb.btype"); if (TYPES[bt]) S.boardType = bt;
  const r = recall("tb.range");
  if (Array.isArray(r)) { S.from = r[0] || ""; S.to = r[1] || ""; }
  else { S.from = iso(new Date(d.getFullYear(), d.getMonth(), 1)); S.to = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  const f = recall("tb.f");
  if (f && typeof f === "object") S.filters = { t: TYPES[f.t] ? f.t : "", a: f.a || "", p: f.p || "", r: f.r || "", h: !!f.h };
  render();
  const start = a => {
    api = a;
    api.subCfg(c => { S.cfg = { ...structuredClone(DEFAULT_CFG), ...(c || {}), weights: (c && c.weights && "done" in c.weights) ? { done: +c.weights.done || 0, ontime: +c.weights.ontime || 0 } : { ...DEFAULT_CFG.weights } }; render(); });
    api.subItems(list => { S.items = list; render();
      if (S.pendingOpen && list.length) { const pid = S.pendingOpen; S.pendingOpen = ""; if (list.some(x => x.id === pid)) openItem(pid); else toast("ไม่พบเรื่องนี้ หรือไม่มีสิทธิ์ดู"); } });
  };
  const demo = msg => { showBanner(msg); start(memoryApi()); };
  const URL_ = window.SUPABASE_URL || "", KEY_ = window.SUPABASE_ANON_KEY || "";
  if (!/^https:\/\/.+\.supabase\.co/.test(URL_) || !KEY_ || /ใส่|YOUR/i.test(KEY_)) {
    demo("โหมดทดลอง: ยังไม่ได้ตั้งค่าไฟล์ config.js (ใส่ Project URL และ anon key ของ Supabase) ข้อมูลที่เพิ่มตอนนี้จะไม่ถูกบันทึก");
    return;
  }
  if (!window.supabase || !window.supabase.createClient) { demo("โหลดระบบฐานข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า"); return; }
  SB = window.supabase.createClient(URL_, KEY_, { auth: { persistSession: true, autoRefreshToken: true } });
  const showLogin = () => { $("#app").hidden = true; $("#login").hidden = false; setTimeout(() => $("#lgEmail").focus(), 0); };
  const authed = user => {
    $("#login").hidden = true; $("#app").hidden = false;
    S.myId = user.id; S.myEmail = (user.email || "").toLowerCase();
    $("#who").textContent = "";
    $("#logoutBtn").hidden = false;
    $("#mineBtn").hidden = false;
    S.mine = recall("tb.mine") === true;
    S.assets = sbAssets(); S.downloads = true;
    applyWriteMode();
    SB.from("members").select("name,role,see_names").eq("email", S.myEmail).maybeSingle().then(({ data }) => {
      S.me = data || null; S.seeNames = (data && Array.isArray(data.see_names)) ? data.see_names : []; S.isAdmin = !!(data && data.role === "admin"); S.seeAll = !!(data && (data.role === "admin" || data.role === "viewall"));
      $("#who").textContent = data && data.name ? data.name : S.myEmail;
      $("#who").title = S.myEmail;
      if (!data) showBanner("บัญชีนี้ยังไม่ได้ผูกชื่อในทีม จึงเห็นเฉพาะงานของทุกคน ให้ผู้ดูแลเพิ่มอีเมลนี้ในตั้งค่า → สมาชิกและสิทธิ์");
      render();
    });
    if (!api) start(sbApi());
    loadLeaves();
  };
  $("#loginForm").onsubmit = async e => {
    e.preventDefault();
    const err = $("#lgErr"); err.hidden = true; $("#lgBtn").disabled = true;
    const raw = $("#lgEmail").value.trim().toLowerCase();
    const { data, error } = await SB.auth.signInWithPassword({ email: raw.includes("@") ? raw : raw + "@team-board.local", password: $("#lgPass").value });
    $("#lgBtn").disabled = false;
    if (error) { err.textContent = /invalid/i.test(error.message) ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง" : "เข้าสู่ระบบไม่สำเร็จ: " + error.message; err.hidden = false; return; }
    authed(data.user);
  };
  $("#logoutBtn").onclick = async () => { await SB.auth.signOut(); location.reload(); };
  SB.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && api) location.reload(); });
  SB.auth.getSession().then(({ data }) => { if (data && data.session) authed(data.session.user); else showLogin(); })
    .catch(() => showLogin());
})();
})();
</script>
